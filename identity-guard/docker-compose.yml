services:
  postgres:
    image: postgres:15-alpine
    container_name: identity_db_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: identity_db
    ports:
      - "5433:5432"
    volumes:
      - identity_pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  identity_pgdata: